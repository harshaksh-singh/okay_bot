[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Production-grade AI Job Discovery, Matching & Application Assistant"
requires-python = ">=3.11"
authors = [{name = "Harshaksh Singh"}]
license = {text = "Proprietary"}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--timeout=30",
    "--timeout-method=thread",
]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "acceptance: Phase 1 acceptance tests",
    "browser: requires Playwright browser; skipped by default (opt in with -m browser)",
    "live: performs real third-party submission; NEVER run in CI (opt in with -m live)",
    "network: performs real outbound HTTP; skipped by default (opt in with -m network)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/discovery/sources/*", "app/browser/*", "app/email/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
